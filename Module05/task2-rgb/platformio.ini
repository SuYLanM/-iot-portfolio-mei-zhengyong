[env:mhetesp32minikit]
platform = espressif32
board = mhetesp32minikit
framework = arduino
monitor_speed = 115200
monitor_echo = yes
; `send_on_enter` is deliberately NOT enabled. That filter buffers input and only
; transmits it once the buffer ends with CRLF, but a Windows/VS Code terminal sends
; a bare CR on Enter, so nothing was ever transmitted and the monitor looked dead.
; The firmware accepts CR, LF and CRLF as line endings instead.
