[env:mhetesp32minikit]
platform = espressif32
board = mhetesp32minikit
framework = arduino
monitor_speed = 115200
monitor_echo = yes
lib_deps =
    makuna/NeoPixelBus
; `send_on_enter` is deliberately NOT enabled: it buffers input until it sees
; CRLF, but a Windows terminal sends a bare CR on Enter, so nothing is ever
; transmitted. The firmware accepts CR, LF and CRLF instead.
